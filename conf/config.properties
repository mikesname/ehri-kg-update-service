# Links
linksGraphQLQuery=conf/links/linksGraphQLQuery.txt
linksShexmlMappingRules=conf/links/linksMappingRules.shexml
linksDeleteSparqlQuery=conf/links/sparqlDeleteLinkData.rq
linksConstructSparqlQuery=conf/links/linksSparqlConstruct.rq